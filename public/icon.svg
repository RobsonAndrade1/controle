<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1c1f28"/>
      <stop offset="100%" stop-color="#0a0b0e"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Fundo do ícone com borda sutil -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  <rect x="8" y="8" width="496" height="496" rx="102" fill="none" stroke="#2a2e3b" stroke-width="4"/>

  <!-- Desenho estilizado do Magic Remote LG -->
  <g transform="translate(146, 66)">
    <!-- Corpo do controle -->
    <rect x="0" y="0" width="220" height="380" rx="46" fill="#14161c" stroke="#373c4d" stroke-width="6"/>
    
    <!-- Botão Power Vermelho no topo -->
    <circle cx="110" cy="50" r="22" fill="#ef4444" filter="url(#glow)"/>
    <path d="M110 38 v14" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
    <path d="M100 44 A 12 12 0 1 0 120 44" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>

    <!-- Anel D-Pad -->
    <circle cx="110" cy="180" r="70" fill="#1f222c" stroke="#2f3444" stroke-width="4"/>
    
    <!-- Botão Central OK Cyan Glow -->
    <circle cx="110" cy="180" r="34" fill="url(#cyanGrad)" filter="url(#glow)"/>
    <text x="110" y="186" text-anchor="middle" fill="#031525" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="18" letter-spacing="1">OK</text>

    <!-- Setas do D-pad -->
    <polygon points="110,122 104,134 116,134" fill="#64748b"/>
    <polygon points="110,238 104,226 116,226" fill="#64748b"/>
    <polygon points="52,180 64,174 64,186" fill="#64748b"/>
    <polygon points="168,180 156,174 156,186" fill="#64748b"/>

    <!-- Colunas de Volume e Canal -->
    <rect x="35" y="275" width="40" height="70" rx="20" fill="#1b1d25" stroke="#2e3342" stroke-width="3"/>
    <text x="55" y="318" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-weight="700" font-size="15">+</text>

    <rect x="145" y="275" width="40" height="70" rx="20" fill="#1b1d25" stroke="#2e3342" stroke-width="3"/>
    <text x="165" y="318" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-weight="700" font-size="15">+</text>

    <!-- Botão Home central inferior -->
    <circle cx="110" cy="310" r="16" fill="#1b1d25" stroke="#2e3342" stroke-width="3"/>
    <polygon points="110,303 103,310 117,310" fill="#22d3ee"/>
    <rect x="105" y="310" width="10" height="7" fill="#22d3ee"/>
  </g>
</svg>
